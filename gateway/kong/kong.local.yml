_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:5174"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type, X-Requested-With, X-Client-Type, Origin, Cookie, Set-Cookie]
      exposed_headers: [Set-Cookie]
      credentials: true
      max_age: 3600

services:
  - name: auth-service
    url: http://host.docker.internal:8081
    routes:
      - name: auth-route
        paths: [/auth]
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis:
            host: redis
            port: 6379
  - name: core-service
    url: http://host.docker.internal:8082
    routes:
      - name: core-route
        paths: [/core]
        strip_path: true
  - name: order-service
    url: http://host.docker.internal:8083
    routes:
      - name: order-route
        paths: [/order]
        strip_path: true
  - name: chat-service
    url: http://host.docker.internal:8084
    routes:
      - name: chat-route
        paths: [/chat]
        strip_path: true
  - name: ai-service
    url: http://ai-service:8085
    routes:
      - name: ai-route
        paths: [/ai]
        strip_path: false
