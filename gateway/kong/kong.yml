_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: redis
          redis:
            host: redis
            port: 6379
  - name: core-service
    url: http://core-service:8082
    routes:
      - name: core-route
        paths:
          - /core
        strip_path: true
  - name: order-service
    url: http://order-service:8083
    routes:
      - name: order-route
        paths:
          - /order
        strip_path: true
  - name: chat-service
    url: http://chat-service:8084
    routes:
      - name: chat-route
        paths:
          - /chat
        strip_path: true
        protocols:
          - http
          - https
