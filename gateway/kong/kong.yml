_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - "https://san-docu-relife.vercel.app"
        - "https://admin-san-docu-relife.vercel.app"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type, X-Requested-With, X-Client-Type, Origin, Cookie, Set-Cookie]
      exposed_headers: [Set-Cookie]
      credentials: true
      preflight_continue: false
      max_age: 3600

upstreams:
  - name: auth-upstream
    algorithm: round-robin
    healthchecks:
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: auth-service:8081
        weight: 100
  - name: core-upstream
    algorithm: round-robin
    healthchecks:
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: core-service:8082
        weight: 100
  - name: order-upstream
    algorithm: round-robin
    healthchecks:
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: order-service:8083
        weight: 100
  - name: chat-upstream
    algorithm: round-robin
    healthchecks:
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: chat-service:8084
        weight: 100
  - name: ai-upstream
    algorithm: round-robin
    healthchecks:
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: ai-service:8085
        weight: 100

services:
  - name: auth-service
    host: auth-upstream
    protocol: http
    port: 80
    retries: 2
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: auth-route
        paths: [/auth]
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: redis
          redis:
            host: redis
            port: 6379
  - name: core-service
    host: core-upstream
    protocol: http
    port: 80
    retries: 2
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: core-route
        paths: [/core]
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          hour: 5000
          policy: redis
          redis:
            host: redis
            port: 6379
  - name: order-service
    host: order-upstream
    protocol: http
    port: 80
    retries: 1
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: order-route
        paths: [/order]
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          hour: 2000
          policy: redis
          redis:
            host: redis
            port: 6379
  - name: chat-service
    host: chat-upstream
    protocol: http
    port: 80
    retries: 1
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: chat-route
        paths: [/chat]
        strip_path: true
        protocols: [http, https]
    plugins:
      - name: rate-limiting
        config:
          minute: 180
          hour: 3000
          policy: redis
          redis:
            host: redis
            port: 6379
  - name: ai-service
    host: ai-upstream
    protocol: http
    port: 80
    retries: 1
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: ai-route
        paths: [/ai]
        strip_path: false
        protocols: [http, https]
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: redis
          redis:
            host: redis
            port: 6379
