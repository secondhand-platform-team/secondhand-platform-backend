spring.application.name=auth-service
server.port=8081

# =======================
# ENCODING (UTF-8)
# =======================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =======================
# DATABASE CONFIG (PostgreSQL)
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/secondhand_auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# =======================
# JWT CONFIG
# =======================
jwt.secret=${JWT_SECRET}
# Access token: 1 day
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh token: 7 days
jwt.refresh-expiration-ms=604800000
# Set true in production (requires HTTPS)
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:true}
app.security.cookie.same-site=${APP_SECURITY_COOKIE_SAME_SITE:None}

# =======================
# CLOUDINARY CONFIG
# =======================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_AVATAR_FOLDER:secondhand-avatars}

# =======================
# MULTIPART FILE UPLOAD
# =======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =======================
# INTERNAL SERVICE URLs
# =======================
order.service.url=${ORDER_SERVICE_URL:http://order-service:8083}
chat.service.url=${CHAT_SERVICE_URL:http://chat-service:8084}

# Debug security (r?t h?u �ch khi test JWT)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# =======================
# SPRING DEVTOOLS (hot reload)
# =======================
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# =======================
# OAUTH2 / GOOGLE CONFIG
# =======================
# Client ID is required for token verification. 
# Get yours from https://console.cloud.google.com/apis/credentials
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
