spring.application.name=auth-service
server.port=8081

# =======================
# DATABASE CONFIG (PostgreSQL)
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/secondhand_auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# =======================
# JWT CONFIG
# =======================
jwt.secret=SECONDHAND_SECRET_KEY_2026_CHANGE_ME
# Access token: 15 minutes
jwt.expiration-ms=900000
# Refresh token: 7 days
jwt.refresh-expiration-ms=604800000
# Set true in production (requires HTTPS)
app.security.cookie.secure=false

# =======================
# CLOUDINARY CONFIG
# =======================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dgachkyc7}
cloudinary.api-key=${CLOUDINARY_API_KEY:421262947271889}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:2YJG_3cmYpWjGX7BW3q598wWQ3g}
cloudinary.folder=secondhand-avatars

# =======================
# MULTIPART FILE UPLOAD
# =======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =======================
# INTERNAL SERVICE URLs
# =======================
order.service.url=${ORDER_SERVICE_URL:http://localhost:8083}
chat.service.url=${CHAT_SERVICE_URL:http://localhost:8084}

# Debug security (r?t h?u �ch khi test JWT)
logging.level.org.springframework.security=DEBUG

# =======================
# SPRING DEVTOOLS (hot reload)
# =======================
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s