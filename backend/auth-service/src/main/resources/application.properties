spring.application.name=auth-service
server.port=8081

# =======================
# DATABASE CONFIG (PostgreSQL)
# =======================
spring.datasource.url=jdbc:postgresql://localhost:5435/secondhand_auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# =======================
# JWT CONFIG
# =======================
jwt.secret=XXzykR5u-F0CZ7rWVg3dla0VH-QLR9qUMUqDeMXvHk7FCAutQPNVySxnbWuR2gwMGKaXvkYKb2q_VFhezWzm0Q
# Access token: 15 minutes
jwt.expiration-ms=900000
# Refresh token: 7 days
jwt.refresh-expiration-ms=604800000
# Set true in production (requires HTTPS)
