spring.application.name=chat-service
server.port=8084

# =========================
# ENCODING (UTF-8)
# =========================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================
# MONGODB
# =========================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/secondhand_chat_db}
spring.data.mongodb.auto-index-creation=true

# =========================
# REDIS
# =========================
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# =========================
# RABBITMQ
# =========================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# =========================
# SPRING DEVTOOLS (hot reload)
# =========================
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
