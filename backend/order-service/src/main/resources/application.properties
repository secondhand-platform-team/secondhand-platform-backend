spring.application.name=order-service
server.port=8083

# =======================
# DATABASE CONFIG (PostgreSQL)
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/secondhand_order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =======================
# FLYWAY
# =======================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline

management.endpoints.web.exposure.include=health,info

# =======================
# JWT CONFIG
# =======================
jwt.secret=SECONDHAND_SECRET_KEY_2026_CHANGE_ME
jwt.expiration-ms=86400000

# Debug security
logging.level.org.springframework.security=DEBUG

# =======================
# SPRING DEVTOOLS (hot reload)
# =======================
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# =======================
# VNPAY CONFIG
# =======================
vnpay.tmn-code=${VNPAY_TMN_CODE:Q7T511E4}
vnpay.secret-key=${VNPAY_SECRET_KEY:UXWSJQI3XEBSAXP2WDEPBZL4TYWEQSA7}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8000/core/api/items/payment-callback}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# =======================
# INTERNAL SERVICE URLs
# =======================
app.core-service.url=${CORE_SERVICE_URL:http://localhost:8082}
app.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# =======================
# RABBITMQ
# =======================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

