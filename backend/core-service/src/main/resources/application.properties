spring.application.name=core-service
server.port=8082

# =======================
# DATABASE CONFIG (PostgreSQL)
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/secondhand_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# =======================
# JWT CONFIG
# =======================
jwt.secret=SECONDHAND_SECRET_KEY_2026_CHANGE_ME
jwt.expiration-ms=86400000
# Debug security (r?t h?u �ch khi test JWT)
logging.level.org.springframework.security=DEBUG

# =======================
# SPRING DEVTOOLS (hot reload)
# =======================
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
