spring.application.name=core-service
server.port=8082

# =======================
# DATABASE CONFIG (PostgreSQL)
# =======================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/secondhand_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# =======================
# JWT CONFIG
# =======================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
# Debug security (r?t h?u �ch khi test JWT)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# =======================
# CLOUDINARY CONFIG
# =======================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_ITEM_FOLDER:secondhand-items}

# =======================
# AUTH SERVICE CONFIG (Feign Client via Kong or direct)
# =======================
# Local (IntelliJ): http://localhost:8000/auth  (qua Kong chạy Docker)
# Docker (full Docker): http://kong:8000/auth
auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}
# =======================
# INTERNAL SERVICE URLs
# =======================
order.service.url=${ORDER_SERVICE_URL:http://order-service:8083}

# =======================
# APP / EDGE CONFIG
# =======================
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.public-api-base-url=${PUBLIC_API_BASE_URL:http://localhost:8000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =======================
# PAYMENT CALLBACK URLs
# =======================
app.payment.wallet-callback-url=${WALLET_CALLBACK_URL:${app.public-api-base-url}/core/api/wallet/payment-callback}
app.payment.item-callback-url=${ITEM_CALLBACK_URL:${app.public-api-base-url}/core/api/items/payment-callback}
app.payment.item-renew-callback-url=${ITEM_RENEW_CALLBACK_URL:${app.public-api-base-url}/core/api/items/payment-renew-callback}

spring.cache.type=redis
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
