name: Backend CI/CD

on:
  push:
    branches:
      - main
      - nguyenvu
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'gateway/kong/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'gateway/kong/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Git ref to deploy on EC2'
        required: false
        default: 'main'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-java-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - core-service
          - order-service
          - chat-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare Maven wrapper
        run: chmod +x mvnw

      - name: Build ${{ matrix.service }}
        run: ./mvnw -B -DskipTests package

  build-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: python -m compileall app

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create placeholder env file
        run: |
          cat > .env.prod <<'EOF'
          POSTGRES_USER=test
          POSTGRES_PASSWORD=test
          POSTGRES_DB=test
          RABBITMQ_DEFAULT_USER=test
          RABBITMQ_DEFAULT_PASS=test
          FRONTEND_BASE_URL=https://example.com
          PUBLIC_API_BASE_URL=https://api.example.com
          APP_CORS_ALLOWED_ORIGINS=https://example.com
          EOF

      - name: Validate docker compose
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml config > /dev/null

  deploy-ec2:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs:
      - build-java-services
      - build-ai-service
      - validate-compose
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to known_hosts
        run: ssh-keyscan -p "${{ secrets.EC2_SSH_PORT || 22 }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || 22 }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          DEPLOY_REF: ${{ github.event.inputs.deploy_ref || 'main' }}
        run: |
          ssh -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" <<EOF
          set -e
          cd "$EC2_APP_DIR"
          git fetch origin
          git checkout "$DEPLOY_REF"
          git pull origin "$DEPLOY_REF"
          docker compose --env-file .env.prod -f docker-compose.prod.yml build auth-service core-service order-service chat-service ai-service
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate auth-service core-service order-service chat-service ai-service
          docker compose --env-file .env.prod -f docker-compose.prod.yml restart kong
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          EOF
